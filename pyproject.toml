[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jepa-moe"
version = "0.1.0"
description = "Minimal low-dimensional MoE dynamics predictors and control-Jacobian tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "torch==2.5.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
synthetic-basis-experiment = "jepa_moe.experiments.synthetic_basis:main"
synthetic-diagnostic-experiments = "jepa_moe.experiments.synthetic_diagnostics:main"
synthetic-warmup-experiment = "jepa_moe.experiments.synthetic_warmup:main"

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
